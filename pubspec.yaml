name: asignacion_aach
description: "Sistema Offline-First para registro, asignación rápida y control operativo de siniestros viales con Google Sheets API y WhatsApp."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter

  # Icons & Material
  cupertino_icons: ^1.0.8

  # State Management
  flutter_riverpod: ^2.5.1

  # Local Persistence (Offline-First)
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Google Workspace & OAuth 2.0
  google_sign_in: ^6.2.1
  googleapis: ^13.2.0
  googleapis_auth: ^1.6.0
  http: ^1.2.2

  # Hardware & Device Integration
  geolocator: ^12.0.0
  url_launcher: ^6.3.0
  share_plus: ^10.0.0
  connectivity_plus: ^6.0.5

  # Data & Formatting
  intl: ^0.19.0
  uuid: ^4.4.2
  csv: ^6.0.0
  path_provider: ^2.1.4
  image_picker: ^1.2.4
  google_mlkit_text_recognition: ^1.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
